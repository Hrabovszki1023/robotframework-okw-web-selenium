name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OKW_BROWSER_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -e ".[dev]"

      - name: Run contract test
        run: |
          . venv/bin/activate
          robot --outputdir results/contract tests/contract.robot

      - name: Run table token tests
        run: |
          . venv/bin/activate
          robot --outputdir results/tokens tests/TableTokens.robot

      - name: Run widget tests (headless Chrome)
        run: |
          . venv/bin/activate
          robot --outputdir results/widgets \
            --exclude External \
            --exclude LoginTest \
            tests/WidgetsDemo.robot \
            tests/Web_*.robot
